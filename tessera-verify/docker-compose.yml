name: tessera-verify
services:
  redis:
    image: redis:7-alpine
    container_name: tessera-verify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - tessera-verify-redis-data:/data
volumes:
  tessera-verify-redis-data:
